[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[project]
name = "kerdus"
version = "0.1.0"
description = "Telegram MCP operations agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "loguru>=0.7.3",
    "mcp>=2.1.1",
    "openai>=3.7.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-telegram-bot>=22.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
lint.ignore = ["PLE1205"]
